apiVersion: apps/v1
kind: Deployment
metadata:
  name: google-pay-processor
  labels:
    app: google-pay-processor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: google-pay-processor
  template:
    metadata:
      labels:
        app: google-pay-processor
    spec:
      containers:
      - name: google-pay-processor
        image: google-pay-processor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: GOOGLEPAY_MERCHANT_ID
          valueFrom:
            secretKeyRef:
              name: googlepay-secrets
              key: merchant-id
        - name: GOOGLEPAY_ENVIRONMENT
          value: "PRODUCTION"
        - name: PAYMENT_PROCESSOR_URL
          valueFrom:
            configMapKeyRef:
              name: googlepay-config
              key: processor-url
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: google-pay-processor
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: google-pay-processor
